name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Validate release tag
        if: github.event_name == 'release' || github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match pyproject version {expected!r}")
          PY

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Prepare release notes
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          changelog = Path("CHANGELOG.md").read_text()
          section = changelog.split(f"## {version} - ", 1)[1]
          notes = section.split("\n", 1)[1].split("\n## ", 1)[0].strip()
          notes += "\n\n### Installation\n\n```bash\n"
          notes += f'pip install "heta-framework[generation]=={version}"\n```\n'
          notes += "\nTask generation requires Python 3.12 and Docker.\n"
          Path("release-notes.md").write_text(notes)
          PY

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *a[0-9]* || "$RELEASE_TAG" == *b[0-9]* || "$RELEASE_TAG" == *rc[0-9]* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Heta Framework $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
