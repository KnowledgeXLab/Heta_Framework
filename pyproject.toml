[tool.setuptools.packages.find]
where = ["src"]
include = ["heta_framework", "heta_framework.*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "live: tests that require external services or live provider APIs",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "UP",
    "W",
]
ignore = [
    "B008",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["src/heta_framework", "tests"]
